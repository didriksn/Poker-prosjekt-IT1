<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Table</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="container">
        <section class="table">
            <div class="seat top" aria-label="Opponent 1">
                <p>Opponent 1</p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat top-left" aria-label="Opponent 2">
                <p>Opponent 2</p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat top-right" aria-label="Opponent 3">
                <p>Opponent 3</p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat left" aria-label="Opponent 4">
                <p>Opponent 4</p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat right" aria-label="Opponent 5">
                <p>Opponent 5</p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat bottom-left" aria-label="Opponent 6">
                <p>Opponent 6</p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat bottom-right" aria-label="Opponent 7">
                <p>Opponent 7</p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat you" aria-label="You">
                <p>You</p>
                <div class="cards">
                    <div class="card">A♠</div>
                    <div class="card red">K♥</div>
                </div>
            </div>

            <div class="pot">Pot: $0</div>
        </section>
    </main>
</body>
</html>
