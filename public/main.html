<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Table</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="main.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="seat-picker" aria-label="Choose your seat">
            <p id="seatPickerStatus">Choose a seat (1-8) to join the table.</p>
            <div id="seatPickerButtons" class="seat-picker-buttons"></div>
        </section>

        <section id="seatChoiceModal" class="seat-choice-modal" aria-label="Seat details" aria-hidden="true">
            <div class="seat-choice-modal-content">
                <h2 id="seatChoiceTitle">Join Seat</h2>
                <label for="seatPlayerName">Username</label>
                <input id="seatPlayerName" type="text" maxlength="24" autocomplete="username" required>

                <label for="seatPlayerPassword">Password</label>
                <input id="seatPlayerPassword" type="password" autocomplete="current-password" required>

                <label for="seatPlayerChips">Starting chips</label>
                <input id="seatPlayerChips" type="number" min="0" step="1" value="1000" required>

                <p id="seatChoiceError" class="seat-choice-error"></p>

                <div class="seat-choice-actions">
                    <button id="seatChoiceCancel" type="button">Cancel</button>
                    <button id="seatChoiceConfirm" type="button">Confirm Seat</button>
                </div>
            </div>
        </section>

        <section class="table">
            <div class="seat slot-top" data-slot="4" aria-label="Seat slot">
                <p></p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat slot-top-left" data-slot="3" aria-label="Seat slot">
                <p></p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat slot-top-right" data-slot="5" aria-label="Seat slot">
                <p></p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat slot-left" data-slot="2" aria-label="Seat slot">
                <p></p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat slot-right" data-slot="6" aria-label="Seat slot">
                <p></p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat slot-bottom-left" data-slot="1" aria-label="Seat slot">
                <p></p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat slot-bottom-right" data-slot="7" aria-label="Seat slot">
                <p></p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div class="seat slot-bottom" data-slot="0" aria-label="Seat slot">
                <p></p>
                <div class="cards">
                    <div class="card back"></div>
                    <div class="card back"></div>
                </div>
            </div>

            <div id="communityCards" class="community-cards" aria-label="Community cards"></div>
 
            <button id="startRoundBtn" class="start-round-btn" type="button">Start Round</button>
            <button id="toggleCardStyleBtn" class="card-style-btn" type="button">Use Suit Backgrounds</button>
        </section>
    </main>
</body>
</html>
